name: Platform checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: moura
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: moura_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U moura -d moura_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://moura:ci-test-only@localhost:5432/moura_test
      TEST_S3_ACCESS_KEY: ci-minio
      TEST_S3_SECRET_KEY: ci-minio-test-secret
      TEST_S3_BUCKET: moura-solar-tests
      S3_ACCESS_KEY: ci-minio
      S3_SECRET_KEY: ci-minio-test-secret
      S3_BUCKET: moura-solar-tests
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm check
      - run: pnpm api:generate
      - run: git diff --exit-code -- packages/api-client
      - name: Build and start the complete local Compose stack
        timeout-minutes: 25
        run: |
          docker compose --env-file .env.example -p moura-ci config --quiet
          docker compose --env-file .env.example -p moura-ci build minio minio-init
          docker compose --env-file .env.example -p moura-ci build migrate api web
          docker compose --env-file .env.example -p moura-ci up -d --wait --wait-timeout 240
          curl --fail --silent --show-error http://localhost:3001/api/v1/health/ready
          curl --fail --silent --show-error --output /dev/null http://localhost:3000
      - run: pnpm test:migrations
      - run: pnpm test:integration
        env:
          TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Compose diagnostics
        if: failure()
        run: docker compose --env-file .env.example -p moura-ci ps -a
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
