name: Platform checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: moura
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: moura_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U moura -d moura_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://moura:ci-test-only@localhost:5432/moura_test
      TEST_S3_ACCESS_KEY: ci-minio
      TEST_S3_SECRET_KEY: ci-minio-test-secret
      TEST_S3_BUCKET: moura-solar-tests
      TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm check
      - run: pnpm api:generate
      - run: git diff --exit-code -- packages/api-client
      - name: Start real document storage and scanner
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=ci-minio -e MINIO_ROOT_PASSWORD=ci-minio-test-secret quay.io/minio/minio:latest server /data
          docker run -d --name clamav -p 3310:3310 clamav/clamav:1.4
      - run: pnpm test:migrations
      - run: pnpm test:integration
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
